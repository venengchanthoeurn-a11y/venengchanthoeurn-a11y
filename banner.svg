<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a13;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient (Orange/Gold to match orange robes) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
    
    <clipPath id="circleView">
      <circle cx="650" cy="125" r="75" />
    </clipPath>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&amp;family=Outfit:wght@300;400;600;800&amp;display=swap');
      
      .tech-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #f97316;
        letter-spacing: 3px;
      }
      
      .name-title {
        font-family: 'Outfit', 'Hanuman', sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      
      .khmer-desc {
        font-family: 'Hanuman', sans-serif;
        font-size: 15px;
        fill: #cbd5e1;
        font-weight: 400;
      }
      
      .eng-desc {
        font-family: 'Outfit', sans-serif;
        font-size: 14px;
        fill: #94a3b8;
        font-weight: 400;
      }
      
      .badge-text {
        font-family: 'Outfit', sans-serif;
        font-size: 11px;
        fill: #0f172a;
        font-weight: 700;
      }
      
      .info-text {
        font-family: 'Outfit', 'Hanuman', sans-serif;
        font-size: 12px;
        fill: #64748b;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="250" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle background dots pattern -->
  <g opacity="0.06">
    <circle cx="40" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="80" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="120" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="160" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="40" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="80" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="120" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="160" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="40" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="80" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="120" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="160" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="120" r="1.5" fill="#ffffff" />
  </g>

  <!-- Glow filter behind image -->
  <circle cx="650" cy="125" r="82" fill="#f97316" opacity="0.15" filter="blur(30px)" />
  <circle cx="50" cy="220" r="70" fill="#eab308" opacity="0.08" filter="blur(40px)" />

  <!-- Left Accent Line -->
  <rect x="25" y="30" width="4" height="190" rx="2" fill="url(#accentGrad)" />

  <!-- Left Content Block -->
  <g transform="translate(45, 0)">
    <!-- Category Badge -->
    <rect x="0" y="32" width="180" height="24" rx="12" fill="#ea580c" opacity="0.15" />
    <circle cx="12" cy="44" r="4.5" fill="#f97316" />
    <text x="26" y="48" class="tech-title">FULL-STACK DEVELOPER</text>
    
    <!-- Name -->
    <text x="0" y="98" class="name-title">Ven. ENG CHANTHOEURN</text>
    
    <!-- Descriptions -->
    <text x="0" y="136" class="khmer-desc">អ្នកអភិវឌ្ឍន៍កម្មវិធី Full-Stack និងបង្កើតដំណោះស្រាយបច្ចេកវិទ្យាឌីជីថលខ្មែរ</text>
    <text x="0" y="160" class="eng-desc">Building premium PWAs, libraries, and temple management systems 🇰🇭</text>
    
    <!-- Badges & Info Row -->
    <g transform="translate(0, 185)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="85" height="22" rx="6" fill="url(#accentGrad)" />
      <text x="12" y="15" class="badge-text">⚡ Full-Stack</text>
      
      <!-- Badge 2 -->
      <rect x="95" y="0" width="60" height="22" rx="6" fill="#ffffff" opacity="0.9" />
      <text x="108" y="15" class="badge-text" fill="#0f172a">📱 PWA</text>
      
      <!-- Location Icon and Text -->
      <g transform="translate(170, 4)">
        <path d="M6 0C2.69 0 0 2.69 0 6c0 5.25 6 10 6 10s6-4.75 6-10c0-3.31-2.69-6-6-6zm0 8.75c-1.52 0-2.75-1.23-2.75-2.75S4.48 3.25 6 3.25s2.75 1.23 2.75 2.75S7.52 8.75 6 8.75z" fill="#94a3b8" transform="scale(0.8)"/>
        <text x="14" y="11" class="info-text">Battambang, Cambodia</text>
      </g>
    </g>
  </g>

  <!-- Right Image Frame -->
  <g>
    <!-- Outer gold Ring -->
    <circle cx="650" cy="125" r="77" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" />
    
    <!-- Image -->
    <image href="profile.jpg" x="575" y="50" width="150" height="150" clip-path="url(#circleView)" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>
