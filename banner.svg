<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a13;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Font Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&amp;family=Outfit:wght@300;400;600;800&amp;display=swap');
      
      .tech-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 300;
        font-size: 14px;
        fill: #60a5fa;
        letter-spacing: 3px;
      }
      
      .name-title {
        font-family: 'Outfit', 'Hanuman', sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      
      .khmer-desc {
        font-family: 'Hanuman', sans-serif;
        font-size: 15px;
        fill: #94a3b8;
        font-weight: 400;
      }
      
      .eng-desc {
        font-family: 'Outfit', sans-serif;
        font-size: 14px;
        fill: #64748b;
        font-weight: 400;
      }
      
      .badge-text {
        font-family: 'Outfit', sans-serif;
        font-size: 11px;
        fill: #e2e8f0;
        font-weight: 600;
      }
      
      .pulse {
        animation: heartbeat 3s ease-in-out infinite both;
      }
      
      @keyframes heartbeat {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="250" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle decorative grid/dots pattern -->
  <g opacity="0.07">
    <circle cx="40" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="80" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="120" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="160" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="40" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="80" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="120" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="160" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="40" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="80" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="120" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="160" cy="120" r="1.5" fill="#ffffff" />
  </g>

  <!-- Soft glow effects -->
  <circle cx="720" cy="125" r="120" fill="#3b82f6" opacity="0.12" filter="blur(50px)" />
  <circle cx="50" cy="220" r="60" fill="#8b5cf6" opacity="0.08" filter="blur(30px)" />

  <!-- Left Accent Line -->
  <rect x="25" y="30" width="4" height="190" rx="2" fill="url(#accentGrad)" />

  <!-- Left Content Block -->
  <g transform="translate(45, 0)">
    <!-- Category Badge -->
    <rect x="0" y="35" width="170" height="24" rx="12" fill="#1e293b" opacity="0.6" />
    <circle cx="12" cy="47" r="4" fill="#3b82f6" />
    <text x="26" y="51" class="tech-title">PORTFOLIO PROFILE</text>
    
    <!-- Name -->
    <text x="0" y="105" class="name-title">Ven. ENG CHANTHOEURN</text>
    
    <!-- Khmer & English Descriptions -->
    <text x="0" y="142" class="khmer-desc">អ្នកអភិវឌ្ឍន៍កម្មវិធី Full-Stack និងបង្កើតដំណោះស្រាយបច្ចេកវិទ្យាឌីជីថលខ្មែរ</text>
    <text x="0" y="165" class="eng-desc">Building premium PWAs, utility libraries, and management systems for communities 🇰🇭</text>
    
    <!-- Badges Row -->
    <g transform="translate(0, 190)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#1d4ed8" opacity="0.8" />
      <text x="14" y="15" class="badge-text">⚡ Full-Stack</text>
      
      <!-- Badge 2 -->
      <rect x="80" y="0" width="60" height="22" rx="6" fill="#6d28d9" opacity="0.8" />
      <text x="94" y="15" class="badge-text">📱 PWA</text>
      
      <!-- Badge 3 -->
      <rect x="150" y="0" width="75" height="22" rx="6" fill="#0369a1" opacity="0.8" />
      <text x="164" y="15" class="badge-text">💻 Clean Code</text>
    </g>
  </g>

  <!-- Right Decorative Graphics -->
  <g transform="translate(640, 125)" class="pulse">
    <!-- Glowing Center -->
    <circle cx="0" cy="0" r="12" fill="#6366f1" opacity="0.8" filter="blur(2px)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    
    <!-- Intersecting tech orbits/rings -->
    <ellipse rx="55" ry="25" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" transform="rotate(-15)" />
    <ellipse rx="55" ry="25" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" transform="rotate(45)" opacity="0.5" />
    <ellipse rx="55" ry="25" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" transform="rotate(105)" opacity="0.3" />
    
    <!-- Tiny orbiting nodes -->
    <circle cx="48" cy="-12" r="3" fill="#60a5fa" />
    <circle cx="-35" cy="18" r="4" fill="#a78bfa" />
    <circle cx="20" cy="22" r="2.5" fill="#f43f5e" />
  </g>
</svg>
